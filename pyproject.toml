[project]
name = "retail-cleaning-pipeline"
version = "0.1.0"
description = "End-to-end reproducible data cleaning pipeline for retail sales CSV data."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<3.0",
    "numpy>=1.25",
    "pandera>=0.20",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

